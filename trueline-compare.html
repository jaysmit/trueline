<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trueline — pages side by side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1216; --ink-3:#6E7684; --ink-4:#9AA1AE;
  --paper:#fff; --wash:#F4F6F9; --line:#E3E7EE;
  --accent:#1F3BC4; --accent-wash:#EEF1FF;
  --display:"Schibsted Grotesk",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--wash);font-family:var(--mono);color:var(--ink);display:flex;flex-direction:column;}

.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--paper);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;}
.mark{width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative;}
.mark::before,.mark::after{content:"";position:absolute;left:5px;height:1.4px;background:#fff;border-radius:1px;}
.mark::before{top:8px;width:12px;} .mark::after{top:12px;width:7px;}
.name{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.03em;}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);}
.spacer{margin-left:auto;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{font:inherit;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 13px;background:var(--paper);border:0;color:var(--ink-3);cursor:pointer;}
.seg button + button{border-left:1px solid var(--line);}
.seg button.is-on{background:var(--accent);color:#fff;}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 4px rgba(15,18,22,.03),0 10px 30px rgba(15,18,22,.06);}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;flex:none;}
.head b{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:-.02em;}
.head span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);}
.head a{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-decoration:none;}
.head a:hover{text-decoration:underline;}
.frame{flex:1;min-height:0;background:var(--paper);display:flex;justify-content:center;overflow:hidden;}
iframe{border:0;width:100%;height:100%;display:block;}
.stage.is-mobile iframe{width:414px;max-width:100%;box-shadow:0 0 0 1px var(--line);}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}
}
</style>
</head>
<body>

<div class="bar">
  <span class="brand"><span class="mark"></span><span class="name">Trueline</span></span>
  <span class="tag">Pages side by side</span>
  <span class="spacer"></span>
  <div class="seg" id="seg">
    <button data-w="desk" class="is-on">Desktop</button>
    <button data-w="mob">Mobile</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="pane">
    <div class="head"><b>Landing</b><span>index.html</span><a href="index.html" target="_blank">Open full</a></div>
    <div class="frame"><iframe src="index.html" title="Landing page"></iframe></div>
  </div>
  <div class="pane">
    <div class="head"><b>How it works</b><span>trueline-how-it-works.html</span><a href="trueline-how-it-works.html" target="_blank">Open full</a></div>
    <div class="frame"><iframe src="trueline-how-it-works.html" title="How it works page"></iframe></div>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById("stage");
  document.getElementById("seg").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(this.querySelectorAll("button"),function(x){ x.classList.toggle("is-on",x===b); });
    stage.classList.toggle("is-mobile", b.dataset.w==="mob");
  });
})();
</script>
</body>
</html>
